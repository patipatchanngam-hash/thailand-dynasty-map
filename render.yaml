services:
  - type: web
    name: thailand-dynasty-map
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /index.php
    autoDeploy: true
    envVars:
      # Neon connection string, e.g. postgresql://user:pass@ep-xxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
